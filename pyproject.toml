[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rubberduck"
version = "0.1.0"
description = "Pre-commit reviewer for subtle logic bugs, using developer intent and cross-file context."
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0",
    "jedi>=0.19",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rubberduck = "rubberduck.cli:main"

[tool.setuptools.packages.find]
include = ["rubberduck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
